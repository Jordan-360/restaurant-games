<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Restaurant Games</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main>
      <h1>Restaurant Games</h1>
      <p class="tagline">Pick a game to play while we wait!</p>

      <nav class="game-list">
        <a href="tic-tac-toe/index.html" class="game-card">
          <span class="game-icon" aria-hidden="true">⭕</span>
          <span class="game-info">
            <span class="game-name">Tic Tac Toe</span>
            <span class="game-desc">Get three in a row to win</span>
          </span>
        </a>

        <a href="hangman/index.html" class="game-card">
          <span class="game-icon" aria-hidden="true">🔤</span>
          <span class="game-info">
            <span class="game-name">Hangman</span>
            <span class="game-desc">Guess the word one letter at a time</span>
          </span>
        </a>

        <a href="memorymatch/index.html" class="game-card">
          <span class="game-icon" aria-hidden="true">🐶</span>
          <span class="game-info">
            <span class="game-name">Memory Match</span>
            <span class="game-desc">Flip the cards and find the pairs</span>
          </span>
        </a>
      </nav>
    </main>
  </body>
</html>
